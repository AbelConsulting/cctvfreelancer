version: '3.8'

services:
  cctvfreelancer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cctvfreelancer-app
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - cctv-network

networks:
  cctv-network:
    driver: bridge
